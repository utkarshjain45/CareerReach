server:
  port: ${PORT:8080}

spring:
  application:
    name: careerreach-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  encryption:
    key: ${TOKEN_ENCRYPTION_SECRET:${APP_ENCRYPTION_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  campaign:
    delay-ms: ${CAMPAIGN_DELAY_MS:2000}

google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:5173/oauth/callback}

supabase:
  url: ${SUPABASE_URL:}
  service-key: ${SUPABASE_SERVICE_KEY:}
  bucket: ${SUPABASE_BUCKET:careerreach-resumes}
  max-file-size: ${SUPABASE_MAX_FILE_SIZE:5242880}

